name: F1c approved companion head
on:
  workflow_call:
    inputs:
      agentrunway_sha:
        description: 'Reviewed exact AgentRunway commit (40 hex characters)'
        required: true
        type: string
      image_run_id:
        description: 'Successful Pinned dogfood runtime run that produced the lock image'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  rendered-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require exact reviewed head
        env:
          APPROVED_HEAD: ${{ inputs.agentrunway_sha }}
        run: '[[ "$APPROVED_HEAD" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: PhiBangKimNguyen/AgentRunway
          ref: ${{ inputs.agentrunway_sha }}
          path: agentrunway
      - name: Read exact source and image lock
        id: lock
        run: |
          python3 - <<'PY'
          import json, os, re
          lock=json.load(open('agentrunway/tools/dogfood/farm/f1c-runtime/lock.json'))
          assert re.fullmatch('[a-f0-9]{40}',lock['revision'])
          assert re.fullmatch('sha256:[a-f0-9]{64}',lock['image'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('revision='+lock['revision']+'\nimage='+lock['image']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.lock.outputs.revision }}
          path: runtime
      - uses: actions/download-artifact@v4
        with:
          name: f1c-ci-image-${{ steps.lock.outputs.revision }}
          run-id: ${{ inputs.image_run_id }}
          github-token: ${{ github.token }}
          path: image
      - name: Verify successful source run and exact image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.image_run_id }}
          IMAGE: ${{ steps.lock.outputs.image }}
          REVISION: ${{ steps.lock.outputs.revision }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > image/run.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('image/run.json')); image=json.load(open('image/f1c-ci-image.json'))
          assert run['conclusion']=='success' and run['head_sha']==os.environ['REVISION']
          assert run['path']=='.github/workflows/dogfood.yml'
          assert image['image']==os.environ['IMAGE'] and image['revision']==os.environ['REVISION']
          assert image['run_id']==os.environ['RUN_ID']
          PY
          docker load -i image/f1c-ci-image.tar.gz
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$REVISION"
      - name: Reproduce committed Compose and execute it through host landing
        env:
          IMAGE: ${{ steps.lock.outputs.image }}
        run: |
          python3 -m venv /tmp/f1c-companion-python
          /tmp/f1c-companion-python/bin/pip install -e './runtime[test]'
          cd agentrunway
          /tmp/f1c-companion-python/bin/python -m tools.dogfood.farm.f1c_runtime
          /tmp/f1c-companion-python/bin/python -m tools.dogfood.farm.f1c --policy tools/dogfood/farm/f1c-fixtures/job.json --input tools/dogfood/farm/f1c-fixtures/input --image "$IMAGE" --output /tmp/f1c-compose.json
          cmp /tmp/f1c-compose.json tools/dogfood/farm/f1c-compose.json
          docker compose -f /tmp/f1c-compose.json config --quiet
          /tmp/f1c-companion-python/bin/python -m unittest discover -s tests/dogfood
          sudo env PYTHONPATH="$PWD:$PWD/../runtime" /tmp/f1c-companion-python/bin/python -m tools.dogfood.farm.f1c_compose_smoke --image "$IMAGE" | tee /tmp/f1c-compose-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: f1c-companion-${{ inputs.agentrunway_sha }}
          path: /tmp/f1c-compose-smoke.json
